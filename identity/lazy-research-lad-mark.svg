<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t">
  <title id="t">Lazy Research Lad</title>
  <!-- The mark: a magnifying lens with a relaxed, half-closed eye inside it.
       Intent — the lens does the careful looking (verified sources, real data), so the researcher can stay calm.
       The handle ends in a small round "thread" knot: one study carried end to end. -->
  <defs>
    <linearGradient id="lrl-fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9656"/>
      <stop offset=".55" stop-color="#F14575"/>
      <stop offset="1" stop-color="#9270F4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="#17121f"/>
  <!-- lens ring -->
  <circle cx="56" cy="54" r="31" fill="none" stroke="url(#lrl-fire)" stroke-width="9"/>
  <!-- relaxed eye: a soft lid line and a lazy lower arc -->
  <path d="M38 55 Q56 44 74 55" fill="none" stroke="#f6efe2" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M42 57 Q56 66 70 57" fill="none" stroke="#f6efe2" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
  <circle cx="56" cy="58.5" r="4.2" fill="#f6efe2"/>
  <!-- handle, ending in the thread knot -->
  <path d="M78 77 L99 98" stroke="url(#lrl-fire)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="103" cy="102" r="6" fill="#9270F4"/>
</svg>
